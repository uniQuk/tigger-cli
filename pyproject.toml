[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "newcli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openai>=1.0", "pyyaml>=6.0"]

[project.scripts]
newcli = "newcli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/newcli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
