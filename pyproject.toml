[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tigger-code"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openai>=1.0", "pyyaml>=6.0", "rich>=13.0", "tiktoken>=0.7", "prompt_toolkit>=3.0", "httpx>=0.27"]

[project.scripts]
tigger-code = "tigger.main:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "types-PyYAML>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/tigger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# COMMAND_HELP and COMMAND_DESCRIPTIONS dicts are user-facing help text
# where wrapping each entry across multiple lines hurts readability more
# than it helps.
"src/tigger/commands/__init__.py" = ["E501"]
# Tool JSON Schema dicts and OpenAI-shaped tool definitions are
# explicitly written long-form for grep-ability.
"src/tigger/tools.py" = ["E501"]
# OpenAI message-shape conversion uses long error/format strings.
"src/tigger/provider.py" = ["E501"]

[tool.mypy]
strict = false
ignore_missing_imports = true
